{% extends 'base.html' %}
{% block content %}
<a class="back" href="{% url 'manage_accounts' %}">← Usuarios</a>
<div class="heading"><h1>Restablecer contraseña</h1></div>
<section class="card reservation-form"><p>{{ target.email }}</p><p class="form-help">Se invalidarán sus sesiones. Comparte la clave temporal directamente con la persona; deberá cambiarla al ingresar.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button>Restablecer contraseña</button></form></section>
{% endblock %}
